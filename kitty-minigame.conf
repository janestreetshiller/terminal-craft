# Terminal Craft pop-out overlay. Loaded instead of the user kitty.conf so
# the minigame window is a fixed 120x36 cell card every launch.
font_family      family="Iosevka Nerd Font Mono"
font_size        12
remember_window_size no
initial_window_width  120c
initial_window_height 36c
confirm_os_window_close 0
macos_quit_when_last_window_closed yes
enabled_layouts stack
hide_window_decorations no
window_padding_width 0
placement_strategy center
cursor_blink_interval 0
enable_audio_bell no
visual_bell_duration 0
background #171310
foreground #efe6d6
selection_foreground #171310
selection_background #ffb454
url_color #4de8e0
wayland_titlebar_color background
macos_option_as_alt yes
# Keep mouse + keyboard protocol available for break/place and key-up.
mouse_hide_wait -1
term xterm-kitty
shell_integration disabled
