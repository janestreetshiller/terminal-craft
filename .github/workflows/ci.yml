name: Native game checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      # Native-window and installed-app checks are explicitly skipped on hosted CI.
      # All portable tests (including assets, CLI, PTY and source contracts) run here.
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/stress_terminal_session.py
