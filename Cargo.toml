[package]
name = "terminal-craft"
version = "0.8.1"
edition = "2021"
rust-version = "1.88"
description = "Terminal Craft — native terminal voxel sandbox with hands and tools"
license = "LicenseRef-All-Rights-Reserved"
publish = false

[[bin]]
name = "terminal-craft"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = false
